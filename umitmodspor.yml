name: Umitmodspor M3U Güncelle

on:
  schedule:
    - cron: '0 */3 * * *'   # her 3 saatte bir
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları yükle
        run: pip install requests beautifulsoup4 pycryptodome urllib3

      - name: Botu çalıştır
        run: python umitmodspor_bot.py

      - name: Değişiklik varsa commit/push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Umitmodspor.m3u
          git diff --cached --quiet || git commit -m "Umitmodspor.m3u güncellendi $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
