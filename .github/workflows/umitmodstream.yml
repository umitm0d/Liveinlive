name: Update Mojari

on:
  schedule:
    - cron: '*/5 * * * *' # Her 5 dakikada bir çalışır
  workflow_dispatch: # Manuel tetikleme butonu

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Script
        run: python umitmodstream.py

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # umitmodstream klasöründeki tüm yeni ve güncellenmiş m3u8 dosyalarını tara
          git add umitmodstream/*.m3u8
          
          # Eğer değişiklik yoksa hata vermeden devam etmesi için || exit 0 kullanıyoruz
          git commit -m "Otomatik Güncelleme: umitmodstream kanalları yenilendi" || exit 0
          git push
