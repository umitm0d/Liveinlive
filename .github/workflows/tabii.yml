name: Tabii Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  scrape_and_update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Depoyu Kontrol Et
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scripti Çalıştır
        run: python main.py config.json

      - name: Değişiklikleri Kaydet ve Gönder
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Oluşan tüm .m3u8 dosyalarını ekle
          git add *.m3u8 myvideo-az/*.m3u8 parsatv/*.m3u8 2>/dev/null || true
          
          # Değişiklik varsa commit et
          git commit -m "Otomatik güncelleme: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" || echo "Değişiklik yok"
          
          # Push et
          git push
