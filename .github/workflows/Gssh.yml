name: M3U ve EPG Güncelleme

on:
  schedule:
    # Her 6 saatte bir çalışır
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Manuel çalıştırmak için

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Repo'yu klonla
      uses: actions/checkout@v3
    
    - name: Python kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Gereksinimleri yükle
      run: |
        pip install requests
    
    - name: M3U ve EPG oluştur
      env:
        KABLO_TOKEN: ${{ secrets.KABLO_TOKEN }}
        GRUP_EKI: ${{ secrets.GRUP_EKI }}
      run: python m3u_generator.py
    
    - name: Değişiklikleri commit et
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add 1UmitTV.m3u kabloepg.xml
        git diff --quiet && git diff --staged --quiet || git commit -m "🔄 M3U ve EPG güncellendi [$(date +'%d.%m.%Y %H:%M')]"
        git push
