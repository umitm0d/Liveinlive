name: Update README with M3U Links

on:
  push:
    paths:
      - '**/*.m3u'
      - '**/*.m3u8'
      - '*.m3u'
      - '*.m3u8'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Find all M3U files and update README
        run: |
          # Repo bilgilerini al
          REPO_FULL="${{ github.repository }}"
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${REPO_FULL#*/}"
          
          echo "📁 Repo: $REPO_FULL"
          echo ""
          
          # Tüm M3U dosyalarını bul (tüm alt klasörler dahil)
          echo "🔍 M3U dosyaları taranıyor..."
          M3U_FILES=$(find . -type f \( -name "*.m3u" -o -name "*.m3u8" \) ! -path "./.git/*" | sed 's|^\./||' | sort)
          
          if [ -z "$M3U_FILES" ]; then
            echo "❌ Hiç M3U dosyası bulunamadı!"
            exit 1
          fi
          
          echo "📋 Bulunan M3U dosyaları:"
          echo "$M3U_FILES"
          echo ""
          
          # README.md'yi oluştur
          cat > README.md << 'EOF'
          <p align="center">
            <img src="https://readme-typing-svg.herokuapp.com?font=Righteous&weight=900&size=60&duration=1&pause=2000&color=00FF00&center=true&vCenter=true&width=500&height=100&lines=%C3%9CM%C4%B0TM0d" alt="ÜMİTM0d" />
          </p>
          
          <p align="center">
            <img src="https://capsule-render.vercel.app/api?type=soft&color=00FF00&height=4&width=400&section=header" />
          </p>
          
          <p align="center">
            <img src="https://komarev.com/ghpvc/?username=umitm0d&label=✦&color=00FF00&style=flat-square" />
          </p>
          
          ---
          
          ## 📺 M3U Listeleri
          
          Bu depoda birden fazla M3U listesi bulunmaktadır. Aşağıdaki linkleri IPTV oynatıcınıza ekleyebilirsiniz.
          
          ## 🔗 jsDelivr CDN Linkleri
          
          EOF
          
          # Her M3U dosyası için link oluştur
          for FILE in $M3U_FILES; do
            CDN_LINK="https://cdn.jsdelivr.net/gh/${REPO_FULL}@main/${FILE}"
            echo "### 📄 \`${FILE}\`" >> README.md
            echo '```' >> README.md
            echo "${CDN_LINK}" >> README.md
            echo '```' >> README.md
            echo "" >> README.md
          done
          
          # Kullanım kılavuzunu ekle
          cat >> README.md << 'EOF'
          ## 📖 Kullanım
          
          1. Yukarıdaki linklerden istediğinizi kopyalayın
          2. IPTV oynatıcınıza (VLC, IPTV Smarters, Tivimate) ekleyin
          3. Liste güncellendiğinde link **aynı kalır**, içerik otomatik yenilenir
          4. jsDelivr önbelleği 5-30 dakika sürebilir
          
          ---
          
          EOF
          
          # Tarih bilgisini ekle
          echo "_Son güncelleme: $(TZ='Europe/Istanbul' date '+%Y-%m-%d %H:%M:%S')_" >> README.md
          
          # EN SONA badge'li başlığı ekle
          cat >> README.md << 'EOF'
          
          ---
          
          <h1 align="center">
            <img src="https://img.shields.io/badge/-%C3%9CM%C4%B0TM0d-000000?style=for-the-badge&logo=github&logoColor=00FF00" />
          </h1>
          EOF
          
          echo ""
          echo "✅ README.md oluşturuldu"
          echo ""
          echo "📋 Oluşturulan linkler:"
          for FILE in $M3U_FILES; do
            echo "   - https://cdn.jsdelivr.net/gh/${REPO_FULL}@main/${FILE}"
          done
          
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # README.md'de değişiklik var mı kontrol et
          if git diff --quiet README.md && git diff --cached --quiet README.md; then
            echo "📝 README.md'de değişiklik yok"
          else
            # Değişiklikleri commit et
            git add README.md
            git commit -m "🔄 M3U linkleri otomatik güncellendi [skip ci]"
            
            # Uzaktaki değişiklikleri çek (merge ile)
            git pull --no-rebase origin main
            
            # Push yap
            git push
            echo "✅ Değişiklikler gönderildi"
          fi
