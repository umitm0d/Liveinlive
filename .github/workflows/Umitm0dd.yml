name: M3U Linkini README'ye Yaz

on:
  push:
    paths:
      - '*.m3u'  # Sadece .m3u uzantılı dosyalar değiştiğinde çalışır

jobs:
  update-link:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: README'ye jsDelivr Linkini Yaz
        run: |
          # Kullanıcı ve repo adını al
          REPO_FULL="${{ github.repository }}"
          # M3U dosyasının adını bul (örnek: playlist.m3u)
          M3U_FILE=$(ls *.m3u 2>/dev/null | head -n 1)
          
          if [ -n "$M3U_FILE" ]; then
            # jsDelivr linkini oluştur
            CDN_LINK="https://cdn.jsdelivr.net/gh/${REPO_FULL}@main/${M3U_FILE}"
            
            # README.md'yi güncelle
            echo "# M3U Listem" > README.md
            echo "" >> README.md
            echo "## 🔗 Güncel Link" >> README.md
            echo "\`\`\`" >> README.md
            echo "$CDN_LINK" >> README.md
            echo "\`\`\`" >> README.md
            echo "" >> README.md
            echo "Bu link, jsDelivr CDN üzerinden otomatik olarak güncellenir." >> README.md
          else
            echo "M3U dosyası bulunamadı."
            exit 1
          fi
          
      - name: Değişiklikleri GitHub'a Gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "M3U linki otomatik güncellendi"
          git push
