name: Full EPG Automation (Safe & Hash Controlled)

on:
  schedule:
    - cron: "0 */6 * * *"  # Her 6 saatte bir
  workflow_dispatch:

jobs:
  epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install aiohttp

      - name: Ensure directories exist
        run: |
          mkdir -p epg
          mkdir -p epg/.hash

      - name: Run EPG update script
        run: python update_epg_full.py

      - name: Check for hash changes and commit
        run: |
          FILES="epg/merged.xml epg/merged.xml.gz"
          CHANGED=false

          for f in $FILES; do
            if [ -f "$f" ]; then
              HASH_FILE="epg/.hash/$(basename $f).hash"
              NEW_HASH=$(sha256sum "$f" | awk '{print $1}')
              OLD_HASH=$(cat "$HASH_FILE" 2>/dev/null || echo "")
              if [ "$NEW_HASH" != "$OLD_HASH" ]; then
                echo "$NEW_HASH" > "$HASH_FILE"
                CHANGED=true
              fi
            fi
          done

          if [ "$CHANGED" = true ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add epg/merged.xml epg/merged.xml.gz epg/.hash/*.hash
            git commit -m "EPG otomatik güncellendi (hash kontrolü ile)"
            git push
          else
            echo "Hiçbir değişiklik yok"
