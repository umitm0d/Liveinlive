name: Full EPG Automation (Safe & Hash Controlled)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install aiohttp

      - name: Run EPG update script
        run: python update_epg_full.py

      - name: Commit & push changes if any
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add epg/merged.xml epg/merged.xml.gz epg/.hash/*.hash
          if ! git diff --cached --quiet; then
            git commit -m "EPG otomatik güncellendi"
            git push
          else
            echo "Hiçbir değişiklik yok"
