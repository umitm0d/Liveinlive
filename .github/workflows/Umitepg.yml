name: Full EPG Automation

on:
  schedule:
    - cron: "0 */6 * * *"   # UTC’ye göre
  workflow_dispatch:

env:
  TZ: Europe/Istanbul

jobs:
  epg:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - run: pip install aiohttp

      - run: python update_epg_full.py

      - name: Commit & Push if changed
        run: |
          git add epg/merged.xml epg/merged.xml.gz epg/.hash/*.hash
          git diff --cached --quiet || (
            git config user.name "github-actions" &&
            git config user.email "actions@github.com" &&
            git commit -m "EPG otomatik güncellendi" &&
            git push
          )
