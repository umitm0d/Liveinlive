name: Generate Adult Playlist

on:
  # push tetikleyicisi kaldırıldı: bu workflow'un zaten kendi cron zamanlaması
  # var, "push: branches: [main]" ile birlikte main'e atılan HER commit'te
  # (bu commit bu repodaki başka bir workflow'un otomatik push'u bile olsa)
  # tekrar tetikleniyordu. main'e gece yarısı yapılan bir push, bu ve benzer
  # push-tetiklemeli birkaç workflow'u aynı anda ateşleyip GitHub Actions
  # eşzamanlılık kotasını dolduruyordu ("waiting for a hosted runner").
  schedule:
    # Her 6 saatte bir çalıştır
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Manuel çalıştırma için

jobs:
  generate-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests dropbox certifi

    - name: Generate playlist and upload to Dropbox
      env:
        DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      run: |
        python adult_playlist.py
