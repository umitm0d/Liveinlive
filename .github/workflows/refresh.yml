name: Playlist Refresh

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Gerekli araçları yükle
        run: |
          sudo apt-get install -y jq curl python3-pip
          pip3 install -q yt-dlp

      - name: Cookie dosyasını oluştur
        run: echo "${{ secrets.YT_COOKIES }}" > cookies.txt

      - name: Script'e çalışma izni ver
        run: chmod +x refresh.sh

      - name: Manifest'leri yenile
        run: ./refresh.sh

      - name: Git ayarları
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Değişiklikleri commit et ve push yap
        run: |
          git add playlist/
          git diff-index --quiet HEAD -- playlist/ || (git commit -m "Refresh: $(date +'%d-%m-%Y %H:%M UTC')" && git push)
